# Spool tracker configuration.
# Add  [include spool_tracker.cfg]  to printer.cfg.
# Every option below is optional; the values shown are the defaults.

[spool_tracker]
#filament_diameter: 1.75
#   Filament diameter in mm.
#materials: PLA:1.24, PETG:1.27, ABS:1.04, ASA:1.07, TPU:1.21, NYLON:1.14, PC:1.20
#   Materials offered when loading a spool, with their density in g/cm3.
#spool_weights: 250, 500, 750, 1000, 2000, 3000
#   Spool sizes (net filament weight in grams) offered when loading a spool.
#default_material: PLA
#default_spool_weight: 1000
#safety_margin: 5
#   Extra % added to the slicer's estimate before comparing it with what is
#   left on the spool (covers purge lines, priming, etc.).
#low_warning_percent: 10
#   Below this % the screen indicator turns red and a console warning is shown.
#check_before_print: True
#   Check the filament estimate when a print starts and ask before printing
#   if the spool may run out.
#save_interval: 30
#   Seconds between saves of the remaining amount while printing.
#state_file: ~/printer_data/config/spool_tracker.json
#   Default: spool_tracker.json next to printer.cfg.
